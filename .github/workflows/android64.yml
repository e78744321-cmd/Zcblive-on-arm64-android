
name: Build ZCB Live Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-android64:
    name: Build Android ARM64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure Android Rust linker
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Build Rust static library
        working-directory: live
        run: |
          cargo build \
            --release \
            --features geode \
            --target aarch64-linux-android

      - name: Build Geode Android64 mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./
          sdk: given
          cli: latest
          build-config: Release
          target: Android64
          bindings: geode-sdk/bindings
          bindings-ref: main
          android-min-sdk: 23
          android-ndk-version: r27c
          combine: false
          use-cpm-cache: true
          use-lto: true

      - name: Upload ZCB Live
        uses: actions/upload-artifact@v4
        with:
          name: ZCB-Live-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          
