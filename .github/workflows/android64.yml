
name: Build ZCB Live Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-22.04

    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find project folder
        shell: bash
        run: |
          echo "Repository files:"
          ls -la

          CARGO_FILE="$(find . -type f -path '*/live/Cargo.toml' -not -path './.git/*' -print -quit)"

          if [ -z "$CARGO_FILE" ]; then
            echo "ERROR: live/Cargo.toml not found!"
            echo "Check that the ZCB Live source files are uploaded."
            exit 1
          fi

          PROJECT_ROOT="${CARGO_FILE%/live/Cargo.toml}"

          echo "Found project: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure Android compiler
        shell: bash
        run: |
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDK/aarch64-linux-android23-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$NDK/aarch64-linux-android23-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android23-clang" >> "$GITHUB_ENV"

      - name: Build Rust library
        shell: bash
        run: |
          cargo build \
            --manifest-path "$PROJECT_ROOT/live/Cargo.toml" \
            --release \
            --features geode \
            --target aarch64-linux-android

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest
          cli: latest
          build-config: Release
          path: ${{ env.PROJECT_ROOT }}
          combine: false
          bindings: geode-sdk/bindings
          android-min-sdk: 23
          use-cpm-cache: true
          use-lto: false

      - name: Upload Android ARM64 mod
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZCB-Live-Android64
          path: |
            **/*.geode
            **/*.so
          if-no-files-found: warn
          
