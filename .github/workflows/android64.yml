
name: Build ZCB Live Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZCB Live source
        shell: bash
        run: |
          mkdir -p source
          unzip -q zcblive-android64-floating-gui.zip -d source

          echo "Extracted files:"
          ls -la source

          if [ ! -f source/live/Cargo.toml ]; then
            echo "ERROR: live/Cargo.toml not found inside ZIP"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure Android compiler
        shell: bash
        run: |
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDK/aarch64-linux-android23-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$NDK/aarch64-linux-android23-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android23-clang" >> "$GITHUB_ENV"

      - name: Build Rust library
        run: |
          cargo build \
            --manifest-path source/live/Cargo.toml \
            --release \
            --features geode \
            --target aarch64-linux-android

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest
          cli: latest
          build-config: Release
          path: source
          combine: false
          bindings: geode-sdk/bindings
          android-min-sdk: 23
          use-cpm-cache: true
          use-lto: false

      - name: Upload build files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZCB-Live-Android64
          path: |
            source/**/*.geode
            source/**/*.so
          if-no-files-found: warn
          
